# ==============================================================================
# LiveKit Server Configuration (with Built-in STUN/TURN & NAT Traversal)
# Domain: live.cocorraapp.com | Server IP: 152.239.115.176
# ==============================================================================

port: 7880
bind_addresses:
  - "0.0.0.0"

# API Keys matching Cocorra.API appsettings.json
keys:
  APIbnoqt7M8yCA4: 4vQLn7Z9GienF7cPZ54SOcA4fYyec5fTSAevDQh2DU5G

logging:
  json: false
  level: info

# ==============================================================================
# Webhooks — REQUIRED, not optional telemetry.
#
# participant_joined is what lets the backend evict someone whose LiveKit token no
# longer matches the database (a kicked user, or anyone holding a credential for a
# room that has ended). LiveKit access tokens are stateless and cannot be revoked,
# so without this feed the only limit on a kicked user rejoining is the token's own
# expiry. See Cocorra.API/Controllers/LiveKitWebhookController.cs.
#
# api_key must name one of the keys above; LiveKit signs each delivery with the
# matching secret and the backend verifies it via the SDK's WebhookReceiver.
# ==============================================================================
webhook:
  api_key: APIbnoqt7M8yCA4
  urls:
    - https://api.cocorraapp.com/Api/V1/Webhooks/LiveKit

# ==============================================================================
# Room creation policy.
#
# auto_create defaults to TRUE, which is what is in force today: the first valid
# token to arrive brings the room into existence. That quietly undoes the teardown
# in RoomService.EndRoomAsync — a participant holding an unexpired token who
# reconnects to an ended room RECREATES it and is admitted, and two of them can
# hear each other in a session the database considers over. The participant_joined
# webhook above evicts them, but only after a round-trip and only while that feed
# is healthy.
#
# The backend now creates rooms explicitly at go-live (LiveKitService
# .EnsureRoomExistsAsync, called from both paths in RoomService), so turning this
# off is survivable. DO NOT flip it until the rollout below is done, because with
# auto_create off, any go-live that failed to create its room becomes a room
# NOBODY CAN JOIN.
#
#   1. Deploy the backend that creates rooms explicitly. (Done — this commit.)
#   2. Watch for "[LIVEKIT] CreateRoom OK" on every go-live, and for the paired
#      warning "went live without being created on the media server". The warning
#      must be absent for a full day of real traffic.
#   3. Only then uncomment the block below and restart LiveKit.
#   4. Roll back by re-commenting it; auto-creation resumes immediately.
#
# empty_timeout is set by the backend per room (LiveKit:RoomEmptyTimeoutMinutes,
# 240m) rather than here, because LiveKit's 5-minute default would reap a room
# during any lull before its first join.
# ==============================================================================
# room:
#   auto_create: false

# WebRTC & Media Engine Configuration
rtc:
  # TCP fallback port when UDP is blocked
  tcp_port: 7881
  
  # UDP port range for media streams (RTP/RTCP audio packets)
  port_range_start: 50000
  port_range_end: 60000
  
  # CRITICAL: Detect & use public IP for ICE candidates advertisement
  use_external_ip: true
  
  # If behind 1:1 NAT, specify the public IP directly:
  # node_ip: "152.239.115.176"

  # ICE Lite (server-driven peer connections)
  ice_lite: true

# Built-in TURN / STUN Server Configuration for Symmetric NAT & Strict Firewalls
turn:
  enabled: true
  domain: live.cocorraapp.com
  
  # Standard STUN/TURN UDP & TCP port
  udp_port: 3478
  
  # Secure TURNS (TLS) port
  tls_port: 5349
  
  # Set to true if TLS is terminated upstream by reverse proxy (Nginx / Caddy)
  external_tls: true

  # Static credentials (synced with Cocorra.API appsettings.json -> LiveKit:IceServers)
  users:
    - username: cocorra_turn_user
      password: CocorraTurnSecretPassword@@2026
