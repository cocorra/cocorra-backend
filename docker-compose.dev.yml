# LOCAL USE ONLY: builds the API image from this checkout and runs it like production
# (ASPNETCORE_ENVIRONMENT=Production) against your own .env.
#
#   docker network create cocorra-network   # once
#   cp .env.example .env                    # fill in local values
#   docker compose -f docker-compose.dev.yml up --build
#
# Production does not use this file: it runs the prebuilt GHCR image with
# deploy/docker-compose.prod.yml, via deploy/deploy.sh.

services:
  cocorra-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cocorra-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    networks:
      - cocorra-network
    # Secrets come from a .env file next to this file, which docker-compose reads
    # automatically. .env is gitignored; copy .env.example and fill it in.
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      # REQUIRED. The `:?` form makes `docker compose up` fail immediately with this
      # message if the variable is unset, so a missing salt is caught before the
      # container starts rather than by the startup guard inside it.
      #
      # Not optional and not defaultable. This salt is what makes the stored IP
      # pseudonymisation irreversible; a shared or guessable value can be brute-forced
      # against the whole IPv4 space in minutes.
      #
      # Quoted because the substitution's error text would otherwise contain a
      # colon-space sequence, which YAML cannot hold in a plain scalar.
      - "Analytics__IpHashSalt=${ANALYTICS_IP_HASH_SALT:?set ANALYTICS_IP_HASH_SALT in .env — copy .env.example and generate a value with openssl rand -base64 32}"

      # REQUIRED. Keys the hashes of stored email OTP codes. Rotating it invalidates
      # only the codes currently outstanding (users request a new one).
      - "Otp__HmacKey=${OTP_HMAC_KEY:?set OTP_HMAC_KEY in .env — generate a value with openssl rand -base64 32}"

      # REQUIRED. Signs every access token; anyone holding it can forge admin tokens.
      # Rotating it signs every user out.
      - "JWTSetting__securityKey=${JWT_SECURITY_KEY:?set JWT_SECURITY_KEY in .env — generate a value with openssl rand -base64 48}"

      # REQUIRED. Password for the admin account IdentitySeeder creates on an empty database.
      - "SeedAdmin__Password=${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env — use a strong unique password}"

      # Analytics event-emission flags. Both default to false in appsettings.json.
      # Uncomment ONLY when the corresponding stage gate in
      # docs/dashboard-discovery/30-production-deployment-checklist.md has passed.
      # Do NOT enable both in the same deploy.
      # - Analytics__EnableNewEventEmission=true      # Stage B
      # - Analytics__EnableHighFrequencyEvents=true   # Stage C (also raise the channel capacity first)
      # - Analytics__EventChannelCapacity=25000       # Stage C, in a SEPARATE earlier deploy

      # REQUIRED. appsettings.json has no connection string, so without this the API has
      # no database and exits at startup when migrations run.
      - "ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?set DB_CONNECTION_STRING in .env — see .env.example}"
    volumes:
      # Persist user-uploaded files (images, voice recordings)
      - cocorra-uploads:/app/wwwroot/Uploads
      # Mount Firebase config (place firebase-config.json next to this file; it must be
      # world-readable, because the container runs as UID 1654)
      - ./firebase-config.json:/app/firebase-config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cocorra-uploads:
    driver: local

networks:
  cocorra-network:
    external: true
