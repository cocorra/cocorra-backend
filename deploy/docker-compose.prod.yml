services:
  cocorra-api:
    image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
    container_name: cocorra-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    networks:
      - cocorra-network
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - "Analytics__IpHashSalt=${ANALYTICS_IP_HASH_SALT:?set ANALYTICS_IP_HASH_SALT in .env}"
      - "Otp__HmacKey=${OTP_HMAC_KEY:?set OTP_HMAC_KEY in .env}"
      - "JWTSetting__securityKey=${JWT_SECURITY_KEY:?set JWT_SECURITY_KEY in .env}"
      - "SeedAdmin__Password=${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}"
      - "ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?set DB_CONNECTION_STRING in .env}"
    volumes:
      - ./firebase-config.json:/app/firebase-config.json:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cocorra-network:
    external: true